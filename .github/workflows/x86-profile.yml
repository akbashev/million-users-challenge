# Not for upstream: swift-iouring-akbashev (#112) sending through its ring, against #112 as it is and against
# fsharp-kestrel-uring-delneg, on one runner: the server on CPU 0, Postgres on CPU 1, mload on CPUs 2-3, all in one
# network namespace. CPU per request (user, sys), system calls and io_uring operations per request, packets per request,
# p95/p99, a perf profile. Two jobs, rotating order.
name: x86 profile
on:
  push:
    branches: [x86-profile-million]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: bench/mload/go.mod, cache: false }
      - name: machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread' | cut -c1-200; uname -r; free -m
      - name: packages (network)
        run: sudo bash profile/packages.sh
      - name: mload
        run: (cd bench/mload && go build -o mload .) && sudo mkdir -p /opt/bench && sudo cp bench/mload/mload /opt/bench/mload
      - name: entries (network)
        run: sudo bash profile/entries.sh swift-iouring-akbashev swift-iouring-akbashev-old fsharp-kestrel-uring-delneg
      - name: rig (namespace, Postgres 18, seed)
        run: sudo bash profile/rig.sh
      - name: tests (#112 sending through the ring)
        run: sudo bash profile/test.sh swift-iouring-akbashev
      - name: runs (100,000 users, -gzip, think 0.7)
        run: |
          if [ "${{ matrix.run }}" = 1 ]; then order="swift-iouring-akbashev fsharp-kestrel-uring-delneg swift-iouring-akbashev-old"
          else order="swift-iouring-akbashev-old fsharp-kestrel-uring-delneg swift-iouring-akbashev"; fi
          for e in $order; do sudo bash profile/run.sh $e $e-${{ matrix.run }} 100000 0.7 30 150; done
      - name: summary
        if: always()
        run: |
          # The runs write as root, perf.data readable by root alone: the upload runs as the runner user.
          sudo chmod -R a+rX profile/out 2>/dev/null || true
          cat profile/out/*/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'profile-${{ matrix.run }}', path: profile/out, retention-days: 7 }
